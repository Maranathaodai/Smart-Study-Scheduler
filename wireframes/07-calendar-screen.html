<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Screen - Smart Study Scheduler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F2F2F7;
            width: 440px;
            height: 956px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 44px;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }
        
        .time {
            font-size: 17px;
            font-weight: 600;
            color: #000000;
        }
        
        .status-icons {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .signal-icon {
            width: 18px;
            height: 12px;
            background: #000000;
            border-radius: 2px;
            position: relative;
        }
        
        .signal-icon::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 2px;
            width: 14px;
            height: 8px;
            background: #000000;
            border-radius: 1px;
        }
        
        .signal-icon::after {
            content: '';
            position: absolute;
            top: -4px;
            left: 4px;
            width: 10px;
            height: 6px;
            background: #000000;
            border-radius: 1px;
        }
        
        .wifi-icon {
            width: 16px;
            height: 12px;
            background: #000000;
            border-radius: 2px;
        }
        
        .battery-icon {
            width: 24px;
            height: 12px;
            border: 1px solid #000000;
            border-radius: 2px;
            position: relative;
        }
        
        .battery-icon::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 3px;
            width: 2px;
            height: 6px;
            background: #000000;
            border-radius: 0 1px 1px 0;
        }
        
        .battery-fill {
            position: absolute;
            top: 1px;
            left: 1px;
            width: 20px;
            height: 8px;
            background: #000000;
            border-radius: 1px;
        }
        
        .container {
            padding: 60px 20px 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        .page-title {
            font-size: 32px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 8px;
            letter-spacing: -0.8px;
        }
        
        .month-year {
            font-size: 18px;
            font-weight: 500;
            color: #8E8E93;
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 100px;
        }
        
        .card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.1);
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .day-header {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #8E8E93;
            padding: 8px 0;
        }
        
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 500;
            color: #000000;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        
        .calendar-day:hover {
            background: #F2F2F7;
        }
        
        .calendar-day.selected {
            background: #007AFF;
            color: #FFFFFF;
        }
        
        .calendar-day.has-session {
            background: #34C759;
            color: #FFFFFF;
        }
        
        .calendar-day.empty {
            color: transparent;
        }
        
        .sessions-title {
            font-size: 18px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 16px;
        }
        
        .session-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #E5E5EA;
        }
        
        .session-item:last-child {
            border-bottom: none;
        }
        
        .session-color {
            width: 4px;
            height: 40px;
            background: #007AFF;
            border-radius: 2px;
            margin-right: 12px;
        }
        
        .session-content {
            flex: 1;
        }
        
        .session-title {
            font-size: 16px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 4px;
        }
        
        .session-details {
            font-size: 14px;
            font-weight: 400;
            color: #8E8E93;
        }
        
        .session-status {
            width: 24px;
            height: 24px;
            background: #FF9500;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-size: 12px;
            font-weight: 600;
        }
        
        .course-colors-title {
            font-size: 18px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 16px;
        }
        
        .color-legend {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .color-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .color-dot {
            width: 16px;
            height: 16px;
            border-radius: 8px;
        }
        
        .color-dot.purple {
            background: #8E4EC6;
        }
        
        .color-dot.blue {
            background: #007AFF;
        }
        
        .color-text {
            font-size: 16px;
            font-weight: 500;
            color: #000000;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 440px;
            height: 80px;
            background: #FFFFFF;
            border-top: 1px solid #E5E5EA;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        
        .nav-icon {
            font-size: 24px;
            color: #8E8E93;
        }
        
        .nav-icon.active {
            color: #007AFF;
        }
        
        .nav-text {
            font-size: 12px;
            font-weight: 500;
            color: #8E8E93;
        }
        
        .nav-text.active {
            color: #007AFF;
        }
        
        .nav-indicator {
            width: 4px;
            height: 4px;
            background: #007AFF;
            border-radius: 2px;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="time">1:45</div>
        <div class="status-icons">
            <div class="signal-icon"></div>
            <div class="wifi-icon"></div>
            <div class="battery-icon">
                <div class="battery-fill"></div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="header">
            <h1 class="page-title">Study Calendar</h1>
            <div class="month-year">October 2025</div>
        </div>
        
        <div class="content">
            <div class="card">
                <div class="calendar-grid">
                    <div class="day-header">Sun</div>
                    <div class="day-header">Mon</div>
                    <div class="day-header">Tue</div>
                    <div class="day-header">Wed</div>
                    <div class="day-header">Thu</div>
                    <div class="day-header">Fri</div>
                    <div class="day-header">Sat</div>
                    
                    <div class="calendar-day empty"></div>
                    <div class="calendar-day empty"></div>
                    <div class="calendar-day empty"></div>
                    <div class="calendar-day selected">1</div>
                    <div class="calendar-day has-session">2</div>
                    <div class="calendar-day">3</div>
                    <div class="calendar-day">4</div>
                    <div class="calendar-day">5</div>
                    <div class="calendar-day">6</div>
                    <div class="calendar-day">7</div>
                    <div class="calendar-day">8</div>
                    <div class="calendar-day">9</div>
                    <div class="calendar-day">10</div>
                    <div class="calendar-day">11</div>
                    <div class="calendar-day">12</div>
                    <div class="calendar-day">13</div>
                    <div class="calendar-day">14</div>
                    <div class="calendar-day">15</div>
                    <div class="calendar-day">16</div>
                    <div class="calendar-day">17</div>
                    <div class="calendar-day">18</div>
                    <div class="calendar-day">19</div>
                    <div class="calendar-day">20</div>
                    <div class="calendar-day">21</div>
                    <div class="calendar-day">22</div>
                    <div class="calendar-day">23</div>
                    <div class="calendar-day">24</div>
                    <div class="calendar-day">25</div>
                    <div class="calendar-day">26</div>
                    <div class="calendar-day">27</div>
                    <div class="calendar-day">28</div>
                    <div class="calendar-day">29</div>
                    <div class="calendar-day">30</div>
                    <div class="calendar-day">31</div>
                </div>
            </div>
            
            <div class="card">
                <h2 class="sessions-title">Today's Sessions</h2>
                <div class="session-item">
                    <div class="session-color"></div>
                    <div class="session-content">
                        <div class="session-title">Her</div>
                        <div class="session-details">1 slides • Pending</div>
                    </div>
                    <div class="session-status">L</div>
                </div>
            </div>
            
            <div class="card">
                <h2 class="course-colors-title">Course Colors</h2>
                <div class="color-legend">
                    <div class="color-item">
                        <div class="color-dot purple"></div>
                        <div class="color-text">But.</div>
                    </div>
                    <div class="color-item">
                        <div class="color-dot blue"></div>
                        <div class="color-text">Her</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="bottom-nav">
        <div class="nav-item">
            <div class="nav-icon">🏠</div>
            <span class="nav-text">Home</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon">📖</div>
            <span class="nav-text">Courses</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon active">🗓️</div>
            <span class="nav-text active">Calendar</span>
            <div class="nav-indicator"></div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">📈</div>
            <span class="nav-text">Progress</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon">👤</div>
            <span class="nav-text">Profile</span>
        </div>
    </div>
</body>
</html>
