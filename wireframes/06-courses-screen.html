<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses Screen - Smart Study Scheduler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .phone-frame {
            width: 300px;
            height: 600px;
            background: #000;
            border-radius: 30px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .screen {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 30px;
            background: #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .header {
            height: 60px;
            background: #f8f8f8;
            border-bottom: 2px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            position: relative;
        }
        
        .add-button {
            position: absolute;
            right: 20px;
            width: 30px;
            height: 30px;
            background: #333;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }
        
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .empty-icon {
            width: 80px;
            height: 80px;
            background: #ddd;
            border-radius: 40px;
            margin: 0 auto 20px;
        }
        
        .empty-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        .empty-description {
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        
        .button {
            background: #333;
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: inline-block;
        }
        
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #f8f8f8;
            border-top: 2px solid #ddd;
            display: flex;
        }
        
        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #666;
        }
        
        .tab.active {
            color: #333;
        }
        
        .tab-icon {
            width: 20px;
            height: 20px;
            background: #ccc;
            border-radius: 3px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            <div class="status-bar">
                <span>9:41</span>
                <span>100%</span>
            </div>
            
            <div class="header">
                <span>My Courses</span>
                <div class="add-button">+</div>
            </div>
            
            <div class="content">
                <div class="empty-state">
                    <div class="empty-icon"></div>
                    <h2 class="empty-title">No courses yet</h2>
                    <p class="empty-description">Add your first course to get started with AI-powered study scheduling</p>
                    <div class="button">Add Course</div>
                </div>
            </div>
            
            <div class="tab-bar">
                <div class="tab">
                    <div class="tab-icon"></div>
                    <span>Home</span>
                </div>
                <div class="tab active">
                    <div class="tab-icon"></div>
                    <span>Courses</span>
                </div>
                <div class="tab">
                    <div class="tab-icon"></div>
                    <span>Calendar</span>
                </div>
                <div class="tab">
                    <div class="tab-icon"></div>
                    <span>Progress</span>
                </div>
                <div class="tab">
                    <div class="tab-icon"></div>
                    <span>Profile</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
