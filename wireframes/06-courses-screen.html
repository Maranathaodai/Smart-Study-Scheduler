<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses Screen - Smart Study Scheduler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F2F2F7;
            width: 440px;
            height: 956px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 44px;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }
        
        .time {
            font-size: 17px;
            font-weight: 600;
            color: #000000;
        }
        
        .status-icons {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .signal-icon {
            width: 18px;
            height: 12px;
            background: #000000;
            border-radius: 2px;
            position: relative;
        }
        
        .signal-icon::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 2px;
            width: 14px;
            height: 8px;
            background: #000000;
            border-radius: 1px;
        }
        
        .signal-icon::after {
            content: '';
            position: absolute;
            top: -4px;
            left: 4px;
            width: 10px;
            height: 6px;
            background: #000000;
            border-radius: 1px;
        }
        
        .wifi-icon {
            width: 16px;
            height: 12px;
            background: #000000;
            border-radius: 2px;
        }
        
        .battery-icon {
            width: 24px;
            height: 12px;
            border: 1px solid #000000;
            border-radius: 2px;
            position: relative;
        }
        
        .battery-icon::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 3px;
            width: 2px;
            height: 6px;
            background: #000000;
            border-radius: 0 1px 1px 0;
        }
        
        .battery-fill {
            position: absolute;
            top: 1px;
            left: 1px;
            width: 20px;
            height: 8px;
            background: #000000;
            border-radius: 1px;
        }
        
        .container {
            padding: 60px 20px 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .page-title {
            font-size: 32px;
            font-weight: 700;
            color: #000000;
            letter-spacing: -0.8px;
        }
        
        .add-button {
            width: 40px;
            height: 40px;
            background: #007AFF;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 100px;
        }
        
        .course-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.1);
        }
        
        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        
        .course-tag {
            background: #8E4EC6;
            color: #FFFFFF;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .course-menu {
            color: #8E8E93;
            font-size: 18px;
            cursor: pointer;
        }
        
        .course-title {
            font-size: 20px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 8px;
        }
        
        .course-subtitle {
            font-size: 14px;
            font-weight: 400;
            color: #8E8E93;
            margin-bottom: 16px;
        }
        
        .progress-section {
            margin-bottom: 16px;
        }
        
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .progress-text {
            font-size: 14px;
            font-weight: 500;
            color: #000000;
        }
        
        .progress-count {
            font-size: 14px;
            font-weight: 400;
            color: #8E8E93;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #E5E5EA;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #8E4EC6;
            border-radius: 4px;
            width: 0%;
        }
        
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 20px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 12px;
            font-weight: 400;
            color: #8E8E93;
        }
        
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .action-button {
            flex: 1;
            height: 40px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .schedule-button {
            background: #8E4EC6;
            color: #FFFFFF;
        }
        
        .study-button {
            background: #F2F2F7;
            color: #8E8E93;
        }
        
        .delete-button {
            width: 100%;
            height: 40px;
            background: #FFFFFF;
            border: 1px solid #FF3B30;
            border-radius: 12px;
            color: #FF3B30;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 440px;
            height: 80px;
            background: #FFFFFF;
            border-top: 1px solid #E5E5EA;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        
        .nav-icon {
            font-size: 24px;
            color: #8E8E93;
        }
        
        .nav-icon.active {
            color: #007AFF;
        }
        
        .nav-text {
            font-size: 12px;
            font-weight: 500;
            color: #8E8E93;
        }
        
        .nav-text.active {
            color: #007AFF;
        }
        
        .nav-indicator {
            width: 4px;
            height: 4px;
            background: #007AFF;
            border-radius: 2px;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="time">1:45</div>
        <div class="status-icons">
            <div class="signal-icon"></div>
            <div class="wifi-icon"></div>
            <div class="battery-icon">
                <div class="battery-fill"></div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="header">
            <h1 class="page-title">My Courses</h1>
            <div class="add-button">+</div>
        </div>
        
        <div class="content">
            <div class="course-card">
                <div class="course-header">
                    <div class="course-tag">Mathematics</div>
                    <div class="course-menu">⋯</div>
                </div>
                
                <h2 class="course-title">But.</h2>
                <p class="course-subtitle">1 file uploaded.</p>
                
                <div class="progress-section">
                    <div class="progress-header">
                        <span class="progress-text">0% Complete</span>
                        <span class="progress-count">0/1</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                </div>
                
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="stat-number">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">0</div>
                        <div class="stat-label">Remaining</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">0%</div>
                        <div class="stat-label">Progress</div>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button class="action-button schedule-button">
                        📅 Study Schedule
                    </button>
                    <button class="action-button study-button">
                        ▶️ Start Study
                    </button>
                </div>
                
                <button class="delete-button">
                    🗑️ Delete Course
                </button>
            </div>
        </div>
    </div>
    
    <div class="bottom-nav">
        <div class="nav-item">
            <div class="nav-icon">🏠</div>
            <span class="nav-text">Home</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon active">📖</div>
            <span class="nav-text active">Courses</span>
            <div class="nav-indicator"></div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">🗓️</div>
            <span class="nav-text">Calendar</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon">📈</div>
            <span class="nav-text">Progress</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon">👤</div>
            <span class="nav-text">Profile</span>
        </div>
    </div>
</body>
</html>
