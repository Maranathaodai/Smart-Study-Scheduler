<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course Screen - Smart Study Scheduler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .phone-frame {
            width: 300px;
            height: 600px;
            background: #000;
            border-radius: 30px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .screen {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 30px;
            background: #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .header {
            height: 60px;
            background: #f8f8f8;
            border-bottom: 2px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            position: relative;
        }
        
        .back-button {
            position: absolute;
            left: 20px;
            width: 30px;
            height: 30px;
            background: #333;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }
        
        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-label {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            display: block;
            font-weight: bold;
        }
        
        .input-field {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background: #f8f8f8;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #333;
            background: white;
        }
        
        .color-selection {
            margin: 20px 0;
        }
        
        .color-options {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        
        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 20px;
            border: 3px solid transparent;
            cursor: pointer;
        }
        
        .color-option.selected {
            border-color: #333;
        }
        
        .color-blue { background: #007AFF; }
        .color-green { background: #34C759; }
        .color-orange { background: #FF9500; }
        .color-red { background: #FF3B30; }
        .color-purple { background: #AF52DE; }
        .color-pink { background: #FF2D92; }
        
        .button {
            background: #333;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin: 10px 0;
            width: 100%;
        }
        
        .button.secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .button.primary {
            background: #34C759;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            <div class="status-bar">
                <span>9:41</span>
                <span>100%</span>
            </div>
            
            <div class="header">
                <div class="back-button">←</div>
                <span>Add New Course</span>
            </div>
            
            <div class="content">
                <div class="input-group">
                    <label class="input-label">Course Name</label>
                    <input class="input-field" type="text" placeholder="Enter course name">
                </div>
                
                <div class="input-group">
                    <label class="input-label">Category</label>
                    <input class="input-field" type="text" placeholder="e.g., Mathematics, Science">
                </div>
                
                <div class="color-selection">
                    <label class="input-label">Course Color</label>
                    <div class="color-options">
                        <div class="color-option color-blue selected"></div>
                        <div class="color-option color-green"></div>
                        <div class="color-option color-orange"></div>
                        <div class="color-option color-red"></div>
                        <div class="color-option color-purple"></div>
                        <div class="color-option color-pink"></div>
                    </div>
                </div>
                
                <div class="button secondary">Upload Files</div>
                
                <div class="button primary">Create Course</div>
            </div>
        </div>
    </div>
</body>
</html>
