<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course Screen - Smart Study Scheduler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F2F2F7;
            width: 440px;
            height: 956px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 44px;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }
        
        .time {
            font-size: 17px;
            font-weight: 600;
            color: #000000;
        }
        
        .status-icons {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .signal-icon {
            width: 18px;
            height: 12px;
            background: #000000;
            border-radius: 2px;
            position: relative;
        }
        
        .signal-icon::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 2px;
            width: 14px;
            height: 8px;
            background: #000000;
            border-radius: 1px;
        }
        
        .signal-icon::after {
            content: '';
            position: absolute;
            top: -4px;
            left: 4px;
            width: 10px;
            height: 6px;
            background: #000000;
            border-radius: 1px;
        }
        
        .wifi-icon {
            width: 16px;
            height: 12px;
            background: #000000;
            border-radius: 2px;
        }
        
        .battery-icon {
            width: 24px;
            height: 12px;
            border: 1px solid #000000;
            border-radius: 2px;
            position: relative;
        }
        
        .battery-icon::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 3px;
            width: 2px;
            height: 6px;
            background: #000000;
            border-radius: 0 1px 1px 0;
        }
        
        .battery-fill {
            position: absolute;
            top: 1px;
            left: 1px;
            width: 20px;
            height: 8px;
            background: #000000;
            border-radius: 1px;
        }
        
        .header {
            position: fixed;
            top: 44px;
            left: 0;
            right: 0;
            height: 60px;
            background: #FFFFFF;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #E5E5EA;
            z-index: 5;
        }
        
        .back-button {
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            color: #007AFF;
            font-size: 20px;
            cursor: pointer;
        }
        
        .page-title {
            flex: 1;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #000000;
        }
        
        .container {
            padding: 120px 20px 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 40px;
        }
        
        .card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.1);
        }
        
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            font-size: 16px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 8px;
            display: block;
        }
        
        .form-input {
            width: 100%;
            height: 50px;
            background: #F2F2F7;
            border: 1px solid #E5E5EA;
            border-radius: 12px;
            padding: 0 16px;
            font-size: 16px;
            color: #000000;
            transition: border-color 0.2s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #007AFF;
        }
        
        .form-input::placeholder {
            color: #8E8E93;
        }
        
        .preferences-section {
            margin-bottom: 20px;
        }
        
        .preferences-title {
            font-size: 16px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 12px;
        }
        
        .preferences-label {
            font-size: 14px;
            font-weight: 500;
            color: #000000;
            margin-bottom: 8px;
        }
        
        .button-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .preference-button {
            flex: 1;
            height: 36px;
            background: #F2F2F7;
            border: 1px solid #E5E5EA;
            border-radius: 18px;
            color: #000000;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .preference-button.active {
            background: #007AFF;
            color: #FFFFFF;
            border-color: #007AFF;
        }
        
        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        
        .category-button {
            height: 36px;
            background: #F2F2F7;
            border: 1px solid #E5E5EA;
            border-radius: 18px;
            color: #000000;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .category-button.active {
            background: #007AFF;
            color: #FFFFFF;
            border-color: #007AFF;
        }
        
        .upload-area {
            border: 2px dashed #E5E5EA;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            background: #F8F9FA;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .upload-area:hover {
            border-color: #007AFF;
            background: #F0F8FF;
        }
        
        .upload-icon {
            width: 60px;
            height: 60px;
            background: #007AFF;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: #FFFFFF;
            font-size: 24px;
        }
        
        .upload-text {
            font-size: 16px;
            font-weight: 500;
            color: #000000;
            margin-bottom: 8px;
        }
        
        .upload-subtext {
            font-size: 14px;
            font-weight: 400;
            color: #8E8E93;
        }
        
        .create-button {
            width: 100%;
            height: 50px;
            background: #007AFF;
            border: none;
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        
        .create-button:hover {
            background: #0056CC;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="time">1:45</div>
        <div class="status-icons">
            <div class="signal-icon"></div>
            <div class="wifi-icon"></div>
            <div class="battery-icon">
                <div class="battery-fill"></div>
            </div>
        </div>
    </div>
    
    <div class="header">
        <button class="back-button">←</button>
        <h1 class="page-title">Add New Course</h1>
    </div>
    
    <div class="container">
        <div class="content">
            <div class="card">
                <h2 class="card-title">Course Information</h2>
                
                <div class="form-group">
                    <label class="form-label">Course Name</label>
                    <input type="text" class="form-input" placeholder="Enter course name">
                </div>
                
                <div class="preferences-section">
                    <h3 class="preferences-title">Study Preferences</h3>
                    
                    <div class="preferences-label">Max Study Time per Session:</div>
                    <div class="button-group">
                        <button class="preference-button">30m</button>
                        <button class="preference-button">45m</button>
                        <button class="preference-button active">60m</button>
                        <button class="preference-button">90m</button>
                    </div>
                    
                    <div class="preferences-label">Chunk Size Preference:</div>
                    <div class="button-group">
                        <button class="preference-button">Small</button>
                        <button class="preference-button active">Medium</button>
                        <button class="preference-button">Large</button>
                    </div>
                </div>
                
                <div class="preferences-section">
                    <h3 class="preferences-title">Category</h3>
                    <div class="category-grid">
                        <button class="category-button">Mathematics</button>
                        <button class="category-button active">Computer Science</button>
                        <button class="category-button">Physics</button>
                        <button class="category-button">Chemistry</button>
                        <button class="category-button">Biology</button>
                        <button class="category-button">History</button>
                        <button class="category-button">Literature</button>
                        <button class="category-button">Other</button>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h2 class="card-title">Upload Materials</h2>
                <div class="upload-area">
                    <div class="upload-icon">☁️</div>
                    <div class="upload-text">Tap to upload files</div>
                    <div class="upload-subtext">PDF, Images, Text files supported</div>
                </div>
            </div>
            
            <button class="create-button">Create Course</button>
        </div>
    </div>
</body>
</html>
