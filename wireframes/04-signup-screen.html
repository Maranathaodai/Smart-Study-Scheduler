<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Screen - Smart Study Scheduler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .phone-frame {
            width: 300px;
            height: 600px;
            background: #000;
            border-radius: 30px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .screen {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 30px;
            background: #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .content {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .welcome-title {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 16px;
        }
        
        .input-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
            display: block;
        }
        
        .input-field {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            background: #f8f8f8;
            transition: border-color 0.3s;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #007AFF;
            background: white;
        }
        
        .create-account-btn {
            width: 100%;
            background: #007AFF;
            color: white;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            margin: 20px 0;
            cursor: pointer;
        }
        
        .divider {
            text-align: center;
            margin: 15px 0;
            color: #666;
            font-size: 14px;
        }
        
        .signin-btn {
            width: 100%;
            background: #f0f0f0;
            color: #333;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            margin-bottom: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            <div class="status-bar">
                <span>9:41</span>
                <span>100%</span>
            </div>
            
            <div class="content">
                <h1 class="welcome-title">Create Account</h1>
                
                <div class="input-group">
                    <label class="input-label">Full Name</label>
                    <input class="input-field" type="text" placeholder="Enter your full name">
                </div>
                
                <div class="input-group">
                    <label class="input-label">Email</label>
                    <input class="input-field" type="email" placeholder="Enter your email">
                </div>
                
                <div class="input-group">
                    <label class="input-label">Password</label>
                    <input class="input-field" type="password" placeholder="Create a password">
                </div>
                
                <div class="input-group">
                    <label class="input-label">Confirm Password</label>
                    <input class="input-field" type="password" placeholder="Confirm your password">
                </div>
                
                <button class="create-account-btn">Create Account</button>
                
                <div class="divider">Already have an account?</div>
                
                <button class="signin-btn">Sign In</button>
            </div>
        </div>
    </div>
</body>
</html>
