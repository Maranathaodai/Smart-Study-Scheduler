<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Screen - Smart Study Scheduler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F2F2F7;
            width: 440px;
            height: 956px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 44px;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }
        
        .time {
            font-size: 17px;
            font-weight: 600;
            color: #000000;
        }
        
        .status-icons {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .signal-icon {
            width: 18px;
            height: 12px;
            background: #000000;
            border-radius: 2px;
            position: relative;
        }
        
        .signal-icon::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 2px;
            width: 14px;
            height: 8px;
            background: #000000;
            border-radius: 1px;
        }
        
        .signal-icon::after {
            content: '';
            position: absolute;
            top: -4px;
            left: 4px;
            width: 10px;
            height: 6px;
            background: #000000;
            border-radius: 1px;
        }
        
        .wifi-icon {
            width: 16px;
            height: 12px;
            background: #000000;
            border-radius: 2px;
        }
        
        .battery-icon {
            width: 24px;
            height: 12px;
            border: 1px solid #000000;
            border-radius: 2px;
            position: relative;
        }
        
        .battery-icon::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 3px;
            width: 2px;
            height: 6px;
            background: #000000;
            border-radius: 0 1px 1px 0;
        }
        
        .battery-fill {
            position: absolute;
            top: 1px;
            left: 1px;
            width: 20px;
            height: 8px;
            background: #000000;
            border-radius: 1px;
        }
        
        .container {
            padding: 60px 20px 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        .page-title {
            font-size: 32px;
            font-weight: 700;
            color: #000000;
            letter-spacing: -0.8px;
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 100px;
        }
        
        .card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.1);
        }
        
        .profile-card {
            text-align: center;
        }
        
        .avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 16px;
        }
        
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 40px;
            background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #FFFFFF;
            font-weight: 700;
        }
        
        .edit-icon {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 24px;
            height: 24px;
            background: #007AFF;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-size: 12px;
            cursor: pointer;
        }
        
        .profile-name {
            font-size: 24px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 8px;
        }
        
        .profile-email {
            font-size: 16px;
            font-weight: 400;
            color: #8E8E93;
            margin-bottom: 16px;
        }
        
        .trophy-icon {
            font-size: 20px;
        }
        
        .about-card {
            position: relative;
        }
        
        .about-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .about-title {
            font-size: 18px;
            font-weight: 600;
            color: #000000;
        }
        
        .about-edit {
            width: 24px;
            height: 24px;
            background: #007AFF;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-size: 12px;
            cursor: pointer;
        }
        
        .about-text {
            font-size: 16px;
            font-weight: 400;
            color: #000000;
            line-height: 1.4;
        }
        
        .stats-title {
            font-size: 18px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 12px;
            font-weight: 400;
            color: #8E8E93;
        }
        
        .most-productive {
            text-align: center;
            padding-top: 16px;
            border-top: 1px solid #E5E5EA;
        }
        
        .most-productive-label {
            font-size: 14px;
            font-weight: 400;
            color: #8E8E93;
            margin-bottom: 4px;
        }
        
        .most-productive-day {
            font-size: 18px;
            font-weight: 600;
            color: #000000;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 440px;
            height: 80px;
            background: #FFFFFF;
            border-top: 1px solid #E5E5EA;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        
        .nav-icon {
            font-size: 24px;
            color: #8E8E93;
        }
        
        .nav-icon.active {
            color: #007AFF;
        }
        
        .nav-text {
            font-size: 12px;
            font-weight: 500;
            color: #8E8E93;
        }
        
        .nav-text.active {
            color: #007AFF;
        }
        
        .nav-indicator {
            width: 4px;
            height: 4px;
            background: #007AFF;
            border-radius: 2px;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="time">1:45</div>
        <div class="status-icons">
            <div class="signal-icon"></div>
            <div class="wifi-icon"></div>
            <div class="battery-icon">
                <div class="battery-fill"></div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="header">
            <h1 class="page-title">Profile</h1>
        </div>
        
        <div class="content">
            <div class="card profile-card">
                <div class="avatar-container">
                    <div class="avatar">M</div>
                    <div class="edit-icon">✏️</div>
                </div>
                <h2 class="profile-name">Mars</h2>
                <p class="profile-email">eugene@gmail.com</p>
                <div class="trophy-icon">🏆</div>
            </div>
            
            <div class="card about-card">
                <div class="about-header">
                    <h2 class="about-title">About</h2>
                    <div class="about-edit">✏️</div>
                </div>
                <p class="about-text">No bio available. Tap the edit icon to add one.</p>
            </div>
            
            <div class="card">
                <h2 class="stats-title">Study Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-number">0</div>
                        <div class="stat-label">Days Streak</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">1</div>
                        <div class="stat-label">Hours Studied</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">4</div>
                        <div class="stat-label">Courses</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">1</div>
                        <div class="stat-label">Best Streak</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">13%</div>
                        <div class="stat-label">Completion Rate</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">8</div>
                        <div class="stat-label">Avg Slides</div>
                    </div>
                </div>
                <div class="most-productive">
                    <div class="most-productive-label">Most Productive Day</div>
                    <div class="most-productive-day">Friday</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="bottom-nav">
        <div class="nav-item">
            <div class="nav-icon">🏠</div>
            <span class="nav-text">Home</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon">📖</div>
            <span class="nav-text">Courses</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon">🗓️</div>
            <span class="nav-text">Calendar</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon">📈</div>
            <span class="nav-text">Progress</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon active">👤</div>
            <span class="nav-text active">Profile</span>
            <div class="nav-indicator"></div>
        </div>
    </div>
</body>
</html>
