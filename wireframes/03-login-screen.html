<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Screen - Smart Study Scheduler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F2F2F7;
            width: 440px;
            height: 956px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 44px;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }
        
        .time {
            font-size: 17px;
            font-weight: 600;
            color: #000000;
        }
        
        .status-icons {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .signal-icon {
            width: 18px;
            height: 12px;
            background: #000000;
            border-radius: 2px;
            position: relative;
        }
        
        .signal-icon::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 2px;
            width: 14px;
            height: 8px;
            background: #000000;
            border-radius: 1px;
        }
        
        .signal-icon::after {
            content: '';
            position: absolute;
            top: -4px;
            left: 4px;
            width: 10px;
            height: 6px;
            background: #000000;
            border-radius: 1px;
        }
        
        .wifi-icon {
            width: 16px;
            height: 12px;
            background: #000000;
            border-radius: 2px;
        }
        
        .battery-icon {
            width: 24px;
            height: 12px;
            border: 1px solid #000000;
            border-radius: 2px;
            position: relative;
        }
        
        .battery-icon::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 3px;
            width: 2px;
            height: 6px;
            background: #000000;
            border-radius: 0 1px 1px 0;
        }
        
        .battery-fill {
            position: absolute;
            top: 1px;
            left: 1px;
            width: 20px;
            height: 8px;
            background: #000000;
            border-radius: 1px;
        }
        
        .container {
            padding: 80px 30px 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .welcome-title {
            font-size: 32px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 12px;
            letter-spacing: -0.8px;
        }
        
        .welcome-subtitle {
            font-size: 16px;
            font-weight: 400;
            color: #8E8E93;
            line-height: 1.4;
        }
        
        .form-container {
            flex: 1;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            font-size: 16px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 8px;
            display: block;
        }
        
        .form-input {
            width: 100%;
            height: 50px;
            background: #FFFFFF;
            border: 1px solid #E5E5EA;
            border-radius: 12px;
            padding: 0 16px;
            font-size: 16px;
            color: #000000;
            transition: border-color 0.2s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #007AFF;
        }
        
        .form-input::placeholder {
            color: #8E8E93;
        }
        
        .password-container {
            position: relative;
        }
        
        .eye-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            background: #8E8E93;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .eye-icon::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 12px;
            height: 8px;
            background: #FFFFFF;
            border-radius: 6px 6px 0 0;
        }
        
        .eye-icon::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            width: 8px;
            height: 6px;
            background: #8E8E93;
            border-radius: 4px 4px 0 0;
        }
        
        .signin-button {
            width: 100%;
            height: 50px;
            background: #007AFF;
            border: none;
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        
        .signin-button:hover {
            background: #0056CC;
        }
        
        .forgot-password-button {
            width: 100%;
            height: 50px;
            background: #FFFFFF;
            border: 1px solid #007AFF;
            border-radius: 12px;
            color: #007AFF;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 40px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        
        .forgot-password-button:hover {
            background: #F0F8FF;
        }
        
        .signup-container {
            text-align: center;
            margin-top: auto;
            padding-bottom: 40px;
        }
        
        .signup-text {
            font-size: 16px;
            color: #8E8E93;
            margin-bottom: 16px;
        }
        
        .signup-button {
            width: 100%;
            height: 50px;
            background: #FFFFFF;
            border: 1px solid #007AFF;
            border-radius: 12px;
            color: #007AFF;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        
        .signup-button:hover {
            background: #F0F8FF;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="time">1:43</div>
        <div class="status-icons">
            <div class="signal-icon"></div>
            <div class="wifi-icon"></div>
            <div class="battery-icon">
                <div class="battery-fill"></div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="header">
            <h1 class="welcome-title">Welcome Back</h1>
            <p class="welcome-subtitle">Sign in to continue your study journey</p>
        </div>
        
        <div class="form-container">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" placeholder="Enter your email">
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="password-container">
                    <input type="password" class="form-input" placeholder="Enter your password">
                    <div class="eye-icon"></div>
                </div>
            </div>
            
            <button class="signin-button">Sign In</button>
            <button class="forgot-password-button">Forgot Password?</button>
        </div>
        
        <div class="signup-container">
            <p class="signup-text">Don't have an account?</p>
            <button class="signup-button">Sign Up</button>
        </div>
    </div>
</body>
</html>
