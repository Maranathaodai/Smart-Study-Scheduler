<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals Screen - Smart Study Scheduler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .phone-frame {
            width: 300px;
            height: 600px;
            background: #000;
            border-radius: 30px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .screen {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 30px;
            background: #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .header {
            height: 60px;
            background: #f8f8f8;
            border-bottom: 2px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            position: relative;
        }
        
        .back-button {
            position: absolute;
            left: 20px;
            width: 30px;
            height: 30px;
            background: #333;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }
        
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .page-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        
        .card {
            background: #f8f8f8;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        
        .goal-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .goal-item:last-child {
            border-bottom: none;
        }
        
        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #ddd;
            border-radius: 3px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .checkbox.checked {
            background: #333;
            color: white;
        }
        
        .goal-text {
            font-size: 14px;
            color: #333;
            flex: 1;
        }
        
        .button {
            background: #333;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            width: 100%;
            margin: 10px 0;
        }
        
        .progress-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .progress-item:last-child {
            border-bottom: none;
        }
        
        .progress-text {
            font-size: 14px;
            color: #333;
        }
        
        .progress-value {
            font-size: 14px;
            color: #666;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            <div class="status-bar">
                <span>9:41</span>
                <span>100%</span>
            </div>
            
            <div class="header">
                <div class="back-button">←</div>
                <span>Goals</span>
            </div>
            
            <div class="content">
                <h1 class="page-title">Today's Goals</h1>
                
                <div class="card">
                    <div class="goal-item">
                        <div class="checkbox"></div>
                        <span class="goal-text">Complete 2 study sessions</span>
                    </div>
                    <div class="goal-item">
                        <div class="checkbox"></div>
                        <span class="goal-text">Review yesterday's notes</span>
                    </div>
                    <div class="goal-item">
                        <div class="checkbox"></div>
                        <span class="goal-text">Take a 10-minute break</span>
                    </div>
                </div>
                
                <div class="button">Add New Goal</div>
                
                <div class="card">
                    <h3 class="card-title">Weekly Goals</h3>
                    <div class="progress-item">
                        <span class="progress-text">Study 5 days this week</span>
                        <span class="progress-value">0/5</span>
                    </div>
                    <div class="progress-item">
                        <span class="progress-text">Complete 10 sessions</span>
                        <span class="progress-value">0/10</span>
                    </div>
                    <div class="progress-item">
                        <span class="progress-text">Review all course materials</span>
                        <span class="progress-value">0/3</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
