<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals Screen - Low Fidelity Wireframe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .phone-frame {
            width: 300px;
            height: 600px;
            background: #000;
            border-radius: 30px;
            padding: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .screen {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 30px;
            background: #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 2px dashed #ccc;
        }
        
        .header {
            height: 50px;
            background: #f0f0f0;
            border-bottom: 2px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #333;
            position: relative;
        }
        
        .back-button {
            position: absolute;
            left: 20px;
            width: 30px;
            height: 30px;
            background: #f0f0f0;
            border: 2px dashed #333;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 16px;
            font-weight: bold;
        }
        
        .content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }
        
        .page-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            border: 2px dashed #333;
            padding: 10px 15px;
        }
        
        .card {
            background: #fff;
            border: 3px dashed #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            border: 2px dashed #333;
            padding: 8px 12px;
        }
        
        .goal-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 2px dashed #f0f0f0;
        }
        
        .goal-item:last-child {
            border-bottom: none;
        }
        
        .checkbox {
            width: 20px;
            height: 20px;
            border: 3px dashed #333;
            border-radius: 4px;
            margin-right: 15px;
            cursor: pointer;
        }
        
        .checkbox.checked {
            background: #333;
        }
        
        .goal-text {
            font-size: 15px;
            color: #333;
            flex: 1;
            font-weight: bold;
        }
        
        .button {
            background: #fff;
            color: #333;
            padding: 15px;
            border: 3px dashed #333;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
        }
        
        .progress-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 2px dashed #f0f0f0;
        }
        
        .progress-item:last-child {
            border-bottom: none;
        }
        
        .progress-text {
            font-size: 15px;
            color: #333;
            font-weight: bold;
        }
        
        .progress-value {
            font-size: 15px;
            color: #666;
            font-weight: bold;
            background: #f0f0f0;
            padding: 5px 10px;
            border: 2px dashed #666;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            <div class="status-bar">
                <span>9:41</span>
                <span>100%</span>
            </div>
            
            <div class="header">
                <div class="back-button">←</div>
                <span>Goals</span>
            </div>
            
            <div class="content">
                <h1 class="page-title">Today's Goals</h1>
                
                <div class="card">
                    <div class="goal-item">
                        <div class="checkbox"></div>
                        <span class="goal-text">Complete 2 study sessions</span>
                    </div>
                    <div class="goal-item">
                        <div class="checkbox"></div>
                        <span class="goal-text">Review yesterday's notes</span>
                    </div>
                    <div class="goal-item">
                        <div class="checkbox"></div>
                        <span class="goal-text">Take a 10-minute break</span>
                    </div>
                </div>
                
                <button class="button">➕ Add New Goal</button>
                
                <div class="card">
                    <h3 class="card-title">Weekly Goals</h3>
                    <div class="progress-item">
                        <span class="progress-text">Study 5 days this week</span>
                        <span class="progress-value">0/5</span>
                    </div>
                    <div class="progress-item">
                        <span class="progress-text">Complete 10 sessions</span>
                        <span class="progress-value">0/10</span>
                    </div>
                    <div class="progress-item">
                        <span class="progress-text">Review all course materials</span>
                        <span class="progress-value">0/3</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
