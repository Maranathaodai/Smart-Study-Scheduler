<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Screen - Low Fidelity Wireframe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .phone-frame {
            width: 300px;
            height: 600px;
            background: #000;
            border-radius: 30px;
            padding: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .screen {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 30px;
            background: #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 2px dashed #ccc;
        }
        
        .content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }
        
        .page-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            border: 2px dashed #333;
            padding: 10px 15px;
        }
        
        .card {
            background: #fff;
            border: 3px dashed #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            border: 2px dashed #333;
            padding: 8px 12px;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #f0f0f0;
            border: 2px dashed #333;
            border-radius: 10px;
            margin: 15px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: #333;
            width: 60%;
            border-radius: 8px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        
        .stat-item {
            text-align: center;
            padding: 15px;
            background: #f0f0f0;
            border: 2px dashed #333;
            border-radius: 8px;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
        }
        
        .chart-placeholder {
            height: 80px;
            background: #f0f0f0;
            border: 3px dashed #333;
            border-radius: 8px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
            font-weight: bold;
        }
        
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #f0f0f0;
            border-top: 2px dashed #ccc;
            display: flex;
            padding: 8px 0;
        }
        
        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #333;
            border: 2px dashed #333;
            margin: 0 5px;
            border-radius: 8px;
        }
        
        .tab.active {
            background: #333;
            color: #fff;
        }
        
        .tab-icon {
            width: 20px;
            height: 20px;
            background: #fff;
            border: 2px dashed #333;
            border-radius: 4px;
            margin-bottom: 4px;
        }
        
        .tab.active .tab-icon {
            background: #fff;
            border: 2px dashed #fff;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            <div class="status-bar">
                <span>9:41</span>
                <span>100%</span>
            </div>
            
            <div class="content">
                <h1 class="page-title">Progress Overview</h1>
                
                <div class="card">
                    <h3 class="card-title">Overall Progress</h3>
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value">0</div>
                            <div class="stat-label">Completed</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">0</div>
                            <div class="stat-label">Remaining</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">0%</div>
                            <div class="stat-label">Complete</div>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <h3 class="card-title">This Week's Activity</h3>
                    <div class="chart-placeholder">Weekly Activity Chart</div>
                </div>
                
                <div class="card">
                    <h3 class="card-title">Achievements</h3>
                    <div class="chart-placeholder">Achievement Badges</div>
                </div>
            </div>
            
            <div class="tab-bar">
                <div class="tab">
                    <div class="tab-icon"></div>
                    <span>Home</span>
                </div>
                <div class="tab">
                    <div class="tab-icon"></div>
                    <span>Courses</span>
                </div>
                <div class="tab">
                    <div class="tab-icon"></div>
                    <span>Calendar</span>
                </div>
                <div class="tab active">
                    <div class="tab-icon"></div>
                    <span>Progress</span>
                </div>
                <div class="tab">
                    <div class="tab-icon"></div>
                    <span>Profile</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
