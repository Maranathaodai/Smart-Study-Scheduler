<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Screen - Low Fidelity Wireframe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .phone-frame {
            width: 300px;
            height: 600px;
            background: #000;
            border-radius: 30px;
            padding: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .screen {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 30px;
            background: #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 2px dashed #ccc;
        }
        
        .content {
            flex: 1;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .signup-title {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            border: 2px dashed #333;
            padding: 15px 20px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-label {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            display: block;
            font-weight: bold;
        }
        
        .input-field {
            width: 100%;
            padding: 15px;
            border: 3px dashed #333;
            border-radius: 8px;
            font-size: 16px;
            background: #fff;
        }
        
        .button {
            background: #fff;
            color: #333;
            padding: 15px;
            border: 3px dashed #333;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
        }
        
        .button.secondary {
            border: 3px dashed #666;
            color: #666;
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
            border: 2px dashed #666;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            <div class="status-bar">
                <span>9:41</span>
                <span>100%</span>
            </div>
            
            <div class="content">
                <h1 class="signup-title">Create Account</h1>
                
                <div class="input-group">
                    <label class="input-label">Full Name</label>
                    <input class="input-field" type="text" placeholder="Enter your full name">
                </div>
                
                <div class="input-group">
                    <label class="input-label">Email</label>
                    <input class="input-field" type="email" placeholder="Enter your email">
                </div>
                
                <div class="input-group">
                    <label class="input-label">Password</label>
                    <input class="input-field" type="password" placeholder="Create a password">
                </div>
                
                <div class="input-group">
                    <label class="input-label">Confirm Password</label>
                    <input class="input-field" type="password" placeholder="Confirm your password">
                </div>
                
                <button class="button">Create Account</button>
                
                <div class="login-link">
                    Already have an account? Login
                </div>
            </div>
        </div>
    </div>
</body>
</html>
