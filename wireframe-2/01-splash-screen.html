<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash Screen - Low Fidelity Wireframe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .phone-frame {
            width: 300px;
            height: 600px;
            background: #000;
            border-radius: 30px;
            padding: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .screen {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 2px dashed #ccc;
        }
        
        .app-logo {
            width: 80px;
            height: 80px;
            background: #fff;
            border: 3px dashed #333;
            border-radius: 40px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 20px;
            font-weight: bold;
        }
        
        .app-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            text-align: center;
            border: 2px dashed #333;
            padding: 10px 20px;
        }
        
        .app-subtitle {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            border: 2px dashed #666;
            padding: 8px 15px;
        }
        
        .loading-indicator {
            width: 30px;
            height: 30px;
            border: 3px dashed #333;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            <div class="status-bar">
                <span>9:41</span>
                <span>100%</span>
            </div>
            
            <div class="app-logo">SS</div>
            <h1 class="app-title">Smart Study Scheduler</h1>
            <p class="app-subtitle">AI-Powered Study Planning</p>
            <div class="loading-indicator"></div>
        </div>
    </div>
</body>
</html>
