<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Screen - Low Fidelity Wireframe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .phone-frame {
            width: 300px;
            height: 600px;
            background: #000;
            border-radius: 30px;
            padding: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .screen {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 30px;
            background: #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 2px dashed #ccc;
        }
        
        .content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }
        
        .page-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            border: 2px dashed #333;
            padding: 10px 15px;
        }
        
        .card {
            background: #fff;
            border: 3px dashed #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            border: 2px dashed #333;
            padding: 8px 12px;
        }
        
        .profile-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .avatar {
            width: 80px;
            height: 80px;
            background: #f0f0f0;
            border: 3px dashed #333;
            border-radius: 40px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 24px;
            font-weight: bold;
        }
        
        .user-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            border: 2px dashed #333;
            padding: 8px 15px;
        }
        
        .user-email {
            color: #666;
            font-size: 14px;
            border: 2px dashed #666;
            padding: 5px 10px;
        }
        
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 2px dashed #f0f0f0;
        }
        
        .menu-item:last-child {
            border-bottom: none;
        }
        
        .menu-left {
            display: flex;
            align-items: center;
        }
        
        .menu-icon {
            width: 20px;
            height: 20px;
            background: #f0f0f0;
            border: 2px dashed #333;
            border-radius: 4px;
            margin-right: 15px;
        }
        
        .menu-text {
            font-size: 16px;
            color: #333;
            font-weight: bold;
        }
        
        .menu-arrow {
            color: #666;
            font-size: 16px;
            font-weight: bold;
        }
        
        .button {
            background: #fff;
            color: #333;
            padding: 15px;
            border: 3px dashed #333;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
        }
        
        .button.logout {
            border: 3px dashed #ff0000;
            color: #ff0000;
        }
        
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #f0f0f0;
            border-top: 2px dashed #ccc;
            display: flex;
            padding: 8px 0;
        }
        
        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #333;
            border: 2px dashed #333;
            margin: 0 5px;
            border-radius: 8px;
        }
        
        .tab.active {
            background: #333;
            color: #fff;
        }
        
        .tab-icon {
            width: 20px;
            height: 20px;
            background: #fff;
            border: 2px dashed #333;
            border-radius: 4px;
            margin-bottom: 4px;
        }
        
        .tab.active .tab-icon {
            background: #fff;
            border: 2px dashed #fff;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            <div class="status-bar">
                <span>9:41</span>
                <span>100%</span>
            </div>
            
            <div class="content">
                <h1 class="page-title">Profile</h1>
                
                <div class="card">
                    <div class="profile-header">
                        <div class="avatar">H</div>
                        <h2 class="user-name">Home</h2>
                        <p class="user-email">account@gmail.com</p>
                    </div>
                </div>
                
                <div class="card">
                    <h3 class="card-title">Settings</h3>
                    <div class="menu-item">
                        <div class="menu-left">
                            <div class="menu-icon"></div>
                            <span class="menu-text">Edit Profile</span>
                        </div>
                        <span class="menu-arrow">></span>
                    </div>
                    <div class="menu-item">
                        <div class="menu-left">
                            <div class="menu-icon"></div>
                            <span class="menu-text">Notifications</span>
                        </div>
                        <span class="menu-arrow">></span>
                    </div>
                    <div class="menu-item">
                        <div class="menu-left">
                            <div class="menu-icon"></div>
                            <span class="menu-text">Privacy & Security</span>
                        </div>
                        <span class="menu-arrow">></span>
                    </div>
                    <div class="menu-item">
                        <div class="menu-left">
                            <div class="menu-icon"></div>
                            <span class="menu-text">Help & Support</span>
                        </div>
                        <span class="menu-arrow">></span>
                    </div>
                </div>
                
                <button class="button logout">Logout</button>
            </div>
            
            <div class="tab-bar">
                <div class="tab">
                    <div class="tab-icon"></div>
                    <span>Home</span>
                </div>
                <div class="tab">
                    <div class="tab-icon"></div>
                    <span>Courses</span>
                </div>
                <div class="tab">
                    <div class="tab-icon"></div>
                    <span>Calendar</span>
                </div>
                <div class="tab">
                    <div class="tab-icon"></div>
                    <span>Progress</span>
                </div>
                <div class="tab active">
                    <div class="tab-icon"></div>
                    <span>Profile</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
