<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course Screen - Low Fidelity Wireframe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .phone-frame {
            width: 300px;
            height: 600px;
            background: #000;
            border-radius: 30px;
            padding: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .screen {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 30px;
            background: #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 2px dashed #ccc;
        }
        
        .header {
            height: 50px;
            background: #f0f0f0;
            border-bottom: 2px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #333;
            position: relative;
        }
        
        .back-button {
            position: absolute;
            left: 20px;
            width: 30px;
            height: 30px;
            background: #f0f0f0;
            border: 2px dashed #333;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 16px;
            font-weight: bold;
        }
        
        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-label {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            display: block;
            font-weight: bold;
        }
        
        .input-field {
            width: 100%;
            padding: 15px;
            border: 3px dashed #333;
            border-radius: 8px;
            font-size: 16px;
            background: #fff;
        }
        
        .color-selection {
            margin: 20px 0;
        }
        
        .color-options {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .color-option {
            width: 30px;
            height: 30px;
            border: 3px dashed #333;
            border-radius: 15px;
            cursor: pointer;
        }
        
        .color-option.selected {
            border: 3px dashed #000;
        }
        
        .button {
            background: #fff;
            color: #333;
            padding: 15px;
            border: 3px dashed #333;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
        }
        
        .button.primary {
            border: 3px dashed #000;
            background: #000;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            <div class="status-bar">
                <span>9:41</span>
                <span>100%</span>
            </div>
            
            <div class="header">
                <div class="back-button">←</div>
                <span>Add New Course</span>
            </div>
            
            <div class="content">
                <div class="input-group">
                    <label class="input-label">Course Name</label>
                    <input class="input-field" type="text" placeholder="Enter course name">
                </div>
                
                <div class="input-group">
                    <label class="input-label">Category</label>
                    <input class="input-field" type="text" placeholder="e.g., Mathematics, Science">
                </div>
                
                <div class="color-selection">
                    <label class="input-label">Course Color</label>
                    <div class="color-options">
                        <div class="color-option selected"></div>
                        <div class="color-option"></div>
                        <div class="color-option"></div>
                        <div class="color-option"></div>
                        <div class="color-option"></div>
                        <div class="color-option"></div>
                    </div>
                </div>
                
                <button class="button">📁 Upload Files</button>
                
                <button class="button primary">Create Course</button>
            </div>
        </div>
    </div>
</body>
</html>
